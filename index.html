<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Career Risk Calculator</title>
  </head>
  <body>
    <div id="root" style="display: none;"></div>
    <div id="loading-screen" style="position: fixed; inset: 0; background-color: #0F4C81; z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease;">
      <div style="width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.3); border-top-color: #ffffff; border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>
    <style>
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
